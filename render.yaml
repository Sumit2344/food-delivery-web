services:
  - type: web
    name: tomato-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: tomato
      - key: UPI_VPA
        value: ""
      - key: UPI_PAYEE_NAME
        value: Tomato Food Delivery
  - type: web
    name: tomato-web
    runtime: node
    rootDir: .
    plan: free
    buildCommand: npm install --omit=dev && npm run build --workspace frontend
    startCommand: npm run start --workspace frontend
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_SERVER_URL
        value: http://tomato-api:4000
